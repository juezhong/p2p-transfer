name: Transfer debug builds (five targets)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: p2p-transfer-debug-windows-x86_64
            executable: p2p-transfer.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: p2p-transfer-debug-macos-x86_64
            executable: p2p-transfer
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: p2p-transfer-debug-macos-aarch64
            executable: p2p-transfer
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: p2p-transfer-debug-linux-x86_64
            executable: p2p-transfer
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: p2p-transfer-debug-linux-aarch64
            executable: p2p-transfer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Cache Cargo downloaded crates and Git checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: Build Transfer CLI debug
        run: cargo build -p transfer-cli --bin p2p-transfer --target ${{ matrix.target }}
      - name: Run all workspace tests including two-process CLI loopback
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Upload CLI debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/debug/${{ matrix.executable }}
          retention-days: 14
          if-no-files-found: error
