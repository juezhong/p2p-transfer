name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo downloaded crates and Git checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: 审计工作区 SDK Git 实例和多版本依赖
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --workspace --prefix none | grep '^p2p-sdk v' | sed 's/ (\*)$//' | sort -u > sdk-versions.txt
          cat sdk-versions.txt
          test "$(wc -l < sdk-versions.txt)" -eq 1
          echo '=== Multiple versions (may be required by transitive semver constraints) ==='
          cargo tree --workspace --duplicates
      - name: 自动格式化 Rust 源码
        run: cargo fmt --all
      - name: 检查格式化后的结果
        run: |
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace
