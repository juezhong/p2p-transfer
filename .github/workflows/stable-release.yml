name: Stable CLI release (versioned)

on:
  pull_request:
    paths:
      - ".github/workflows/stable-release.yml"
      - "crates/transfer-cli/Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stable-release.yml"
      - "crates/transfer-cli/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate stable CLI version, Cargo.lock and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import tomllib

          cli = tomllib.loads(pathlib.Path("crates/transfer-cli/Cargo.toml").read_text())
          version = cli["package"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"Not a stable SemVer: {version}")
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          locked = [p["version"] for p in lock["package"] if p["name"] == "transfer-cli"]
          if locked != [version]:
              raise SystemExit(f"Cargo.lock mismatch: {locked} vs {version}")
          notes = pathlib.Path(f"docs/releases/v{version}.md")
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          print(f"Validated stable v{version} and release notes")
          PY
      - name: Format Rust code in CI workspace only
        run: cargo fmt --all
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, filename: p2p-transfer-windows-x86_64.exe, executable: p2p-transfer.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, filename: p2p-transfer-macos-x86_64, executable: p2p-transfer }
          - { os: macos-latest, target: aarch64-apple-darwin, filename: p2p-transfer-macos-aarch64, executable: p2p-transfer }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, filename: p2p-transfer-linux-x86_64, executable: p2p-transfer }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, filename: p2p-transfer-linux-aarch64, executable: p2p-transfer }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, filename: p2p-transfer-linux-x86_64-musl, executable: p2p-transfer }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, filename: p2p-transfer-linux-aarch64-musl, executable: p2p-transfer }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout matches workflow commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}
      - name: Cargo source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: Format Rust code in CI workspace only
        run: cargo fmt --all
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build release CLI
        run: cargo build --locked -p transfer-cli --bin p2p-transfer --release --target ${{ matrix.target }}
      - name: Ensure musl binary is static
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          ! readelf -l "$BIN" | grep -q INTERP
          ! readelf -d "$BIN" | grep -q NEEDED
      - name: Copy release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          merge-multiple: true
          path: dist
      - name: Publish versioned stable release without overwriting tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/transfer-cli/Cargo.toml", "rb"))["package"]["version"])')"
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          test -f "$NOTES"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; not overwriting the tag or assets."
              exit 0
            fi
            echo "Tag $TAG exists without a GitHub Release; refusing to overwrite it." >&2
            exit 1
          fi
          test "$(find dist -maxdepth 1 -name 'p2p-transfer-*' -type f | wc -l)" -eq 7
          for binary in             p2p-transfer-windows-x86_64.exe             p2p-transfer-macos-x86_64             p2p-transfer-macos-aarch64             p2p-transfer-linux-x86_64             p2p-transfer-linux-aarch64             p2p-transfer-linux-x86_64-musl             p2p-transfer-linux-aarch64-musl; do
            test -s "dist/$binary"
          done
          (cd dist && sha256sum p2p-transfer-* > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" dist/p2p-transfer-* dist/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "p2p-transfer $TAG (stable CLI)"             --notes-file "$NOTES"             --latest
