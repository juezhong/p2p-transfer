name: Stable CLI release (seven targets)

on:
  pull_request:
    paths: [".github/workflows/stable-release.yml", "crates/transfer-cli/Cargo.toml", "Cargo.lock"]
  push:
    branches: [main]
    paths: [".github/workflows/stable-release.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate CLI version
        shell: bash
        run: grep -q '^version = "0.1.0"$' crates/transfer-cli/Cargo.toml
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, filename: p2p-transfer-windows-x86_64.exe, executable: p2p-transfer.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, filename: p2p-transfer-macos-x86_64, executable: p2p-transfer }
          - { os: macos-latest, target: aarch64-apple-darwin, filename: p2p-transfer-macos-aarch64, executable: p2p-transfer }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, filename: p2p-transfer-linux-x86_64, executable: p2p-transfer }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, filename: p2p-transfer-linux-aarch64, executable: p2p-transfer }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, filename: p2p-transfer-linux-x86_64-musl, executable: p2p-transfer }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, filename: p2p-transfer-linux-aarch64-musl, executable: p2p-transfer }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install native musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: Run workspace tests
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build Release CLI
        run: cargo build --locked -p transfer-cli --bin p2p-transfer --release --target ${{ matrix.target }}
      - name: Check portable musl ELF
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          ! readelf -l "$BIN" | grep -q INTERP
          ! readelf -d "$BIN" | grep -q NEEDED
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          merge-multiple: true
          path: dist
      - name: Guarantee original test.8 source baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=e78f2083b9807c7fdc1864e4c4cd9ea824ca0c62
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          test "$(tr -d '[:space:]' < PREVIEW_VERSION)" = "v0.1.0-test.8"
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock|README.md|docs/STATUS.md|docs/releases/stable-v0.1.0.md|crates/transfer-cli/Cargo.toml|.github/workflows/stable-release.yml) ;;
              *) echo "Unexpected functional change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          grep -q '^version = "0.1.0"$' crates/transfer-cli/Cargo.toml
      - name: Publish stable release (do not overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; not overwriting."
            exit 0
          fi
          test "$(find dist -maxdepth 1 -name 'p2p-transfer-*' -type f | wc -l)" -eq 7
          (cd dist && sha256sum p2p-transfer-* > SHA256SUMS.txt)
          gh release create "$TAG" dist/p2p-transfer-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "p2p-transfer v0.1.0 (first stable CLI)" \
            --notes-file docs/releases/stable-v0.1.0.md \
            --latest
