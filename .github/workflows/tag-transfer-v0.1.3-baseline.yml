name: Tag accepted Transfer v0.1.3 baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-transfer-v0.1.3-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anchor original v0.1.3 source before any CLI follow-up work
        shell: bash
        run: |
          set -euo pipefail
          TARGET="acdfea134cebe28683151f7e859b6eccefa6c6e4"
          TAG="transfer-v0.1.3-accepted-baseline"
          git cat-file -e "$TARGET^{commit}"
          test "$(git rev-parse "v0.1.3^{commit}")" = "$TARGET"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            ACTUAL="$(git rev-parse "$TAG^{commit}")"
            test "$ACTUAL" = "$TARGET" || { echo "Tag already points elsewhere" >&2; exit 1; }
            echo "$TAG already points to original stable baseline"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" "$TARGET" -m "User accepted stable p2p-transfer v0.1.3; keep transfer-core protocol unchanged"
          git push origin "refs/tags/$TAG"
