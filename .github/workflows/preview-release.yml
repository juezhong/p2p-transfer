name: Preview release (five platforms)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "PREVIEW_VERSION"
      - ".github/workflows/preview-release.yml"
      - "crates/**"
      - "Cargo.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            filename: p2p-transfer-windows-x86_64.exe
            executable: p2p-transfer.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            filename: p2p-transfer-macos-x86_64
            executable: p2p-transfer
          - os: macos-latest
            target: aarch64-apple-darwin
            filename: p2p-transfer-macos-aarch64
            executable: p2p-transfer
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            filename: p2p-transfer-linux-x86_64
            executable: p2p-transfer
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            filename: p2p-transfer-linux-aarch64
            executable: p2p-transfer
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            filename: p2p-transfer-linux-x86_64-musl
            executable: p2p-transfer
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            filename: p2p-transfer-linux-aarch64-musl
            executable: p2p-transfer
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install native musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Cache Cargo downloaded crates and Git checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: Test real workspace including two-process localhost file transfers
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build optimized CLI
        run: cargo build -p transfer-cli --bin p2p-transfer --release --target ${{ matrix.target }}
      - name: Verify MUSL ELF has no dynamic loader
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "musl portable binary unexpectedly needs a dynamic loader" >&2
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "musl portable binary unexpectedly needs shared objects" >&2
            exit 1
          fi
          file "$BIN"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: dist
      - name: Publish explicit pre-release version if not yet present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < PREVIEW_VERSION)"
          [[ "$TAG" == v*-test.* ]] || { echo "Invalid preview tag" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview $TAG already published; will not overwrite immutable test assets."
            exit 0
          fi
          test "$(find dist -maxdepth 1 -name 'p2p-transfer-*' -type f | wc -l)" -eq 7
          (cd dist && sha256sum p2p-transfer-* > SHA256SUMS.txt)
          gh release create "$TAG" dist/p2p-transfer-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "p2p-transfer $TAG (NAT field-test preview)" \
            --notes-file docs/releases/preview-v0.1.0-test.3.md
