name: Seven-target CLI build verification

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-release.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            filename: p2p-transfer-windows-x86_64.exe
            executable: p2p-transfer.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            filename: p2p-transfer-macos-x86_64
            executable: p2p-transfer
          - os: macos-latest
            target: aarch64-apple-darwin
            filename: p2p-transfer-macos-aarch64
            executable: p2p-transfer
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            filename: p2p-transfer-linux-x86_64
            executable: p2p-transfer
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            filename: p2p-transfer-linux-aarch64
            executable: p2p-transfer
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            filename: p2p-transfer-linux-x86_64-musl
            executable: p2p-transfer
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            filename: p2p-transfer-linux-aarch64-musl
            executable: p2p-transfer
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install native musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Cache Cargo downloaded crates and Git checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-src-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-src-${{ runner.os }}-
      - name: Test real workspace including two-process localhost file transfers
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - name: Build optimized CLI
        run: cargo build --locked -p transfer-cli --bin p2p-transfer --release --target ${{ matrix.target }}
      - name: Verify MUSL ELF has no dynamic loader
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "musl portable binary unexpectedly needs a dynamic loader" >&2
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "musl portable binary unexpectedly needs shared objects" >&2
            exit 1
          fi
          file "$BIN"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-build-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30
