[package]
name = "transfer-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "p2p-transfer"
path = "src/main.rs"

[dependencies]
transfer-core = { path = "../transfer-core" }

p2p-sdk = { git = "https://github.com/juezhong/p2p-sdk", rev = "126739de49fdb60a33d4426efc9f4ce1e4a37bf8" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
