[package]
name = "transfer-cli"
version = "0.1.0-test.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "p2p-transfer"
path = "src/main.rs"

[dependencies]
transfer-core = { path = "../transfer-core" }

p2p-sdk = { git = "https://github.com/juezhong/p2p-sdk", rev = "4372e6afb2d31a61b3be415e47c8fe2b5d9ac897" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "signal"] }
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
shell-words = "1.1"
rustyline = "15.0"
