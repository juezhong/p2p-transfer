[package]
name = "transfer-cli"
version = "0.1.0-test.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "p2p-transfer"
path = "src/main.rs"

[dependencies]
transfer-core = { path = "../transfer-core" }

p2p-sdk = { git = "https://github.com/juezhong/p2p-sdk", rev = "193be7e04ece47afe53a9d0a4e2b0f4574f5ffbc" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "signal"] }
shell-words = "1.1"
rustyline = "15.0"
